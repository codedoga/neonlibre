name: build

# Builds the compute images (PostgreSQL 17 and 18) and the storage image for amd64
# and arm64, tests them on a docker-compose Neon stack, and publishes them to GHCR.
#
# Published tags (see README):
#   ghcr.io/<owner>/neonlibre/compute-v18:18.6.<build>, 18.6, 18, latest
#   ghcr.io/<owner>/neonlibre/compute-v17:17.11.<build>, 17.11, 17, latest
#   ghcr.io/<owner>/neonlibre/storage:<build>, latest
# <build> is one counter shared by all images of a release, so equal numbers belong together.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild: picks up Debian security updates, which the Dockerfiles apt-get at build time.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the images if the tests pass
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/neonlibre
  REF: ${{ inputs.ref || github.sha }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      pg17: ${{ steps.v.outputs.pg17 }}
      pg18: ${{ steps.v.outputs.pg18 }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - id: v
        run: |
          git submodule update --init --depth 1 vendor/postgres-v17 vendor/postgres-v18
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          for v in 17 18; do
            echo "pg$v=$(sed -n "s/^PACKAGE_VERSION='\(.*\)'$/\1/p" vendor/postgres-v$v/configure)" >> "$GITHUB_OUTPUT"
          done
          publish=false
          if [[ "${{ inputs.publish }}" == true ]] || [[ "${{ github.event_name }}" == schedule ]] ||
             [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/main ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  compute-base:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - run: git submodule update --init --depth 1 vendor/postgres-v${{ matrix.pg }}
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ci/build-compute.sh ${{ matrix.pg }} ${{ matrix.arch }} base

  compute-stage:
    needs: [meta, compute-base]
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        arch: [amd64, arm64]
        group: [postgis, rdkit, plv8, duckdb, mooncake, pgrag, pgrx]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - run: git submodule update --init --depth 1 vendor/postgres-v${{ matrix.pg }}
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ci/build-compute.sh ${{ matrix.pg }} ${{ matrix.arch }} stage ${{ matrix.group }}

  compute:
    needs: [meta, compute-stage]
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - run: git submodule update --init --depth 1 vendor/postgres-v${{ matrix.pg }}
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          ci/build-compute.sh ${{ matrix.pg }} ${{ matrix.arch }} final
          ${{ env.REGISTRY }}/compute-v${{ matrix.pg }}:ci-${{ needs.meta.outputs.sha }}-${{ matrix.arch }}
        env:
          BUILD_TAG: ${{ needs.meta.outputs.sha }}

  storage:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      # postgres_ffi's bindgen needs the headers of every version it supports, so all submodules.
      - run: git submodule update --init --depth 1
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REPOSITORY=ghcr.io/neondatabase
            IMAGE=build-tools
            TAG=pinned-bookworm
            DEBIAN_VERSION=bookworm
            GIT_VERSION=${{ needs.meta.outputs.sha }}
            BUILD_TAG=${{ needs.meta.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/cache:storage-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/cache:storage-${{ matrix.arch }},mode=max,ignore-error=true
          push: true
          tags: ${{ env.REGISTRY }}/storage:ci-${{ needs.meta.outputs.sha }}-${{ matrix.arch }}

  test:
    needs: [meta, compute, storage]
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      PG_VERSION: ${{ matrix.pg }}
      CI_TAG: ci-${{ needs.meta.outputs.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and retag the images under the names docker-compose expects
        run: |
          for pair in "storage:neon" "compute-v$PG_VERSION:compute-node-v$PG_VERSION" \
                      "test-extensions-v$PG_VERSION:neon-test-extensions-v$PG_VERSION"; do
            docker pull "$REGISTRY/${pair%%:*}:$CI_TAG"
            docker tag "$REGISTRY/${pair%%:*}:$CI_TAG" "neonlibre/${pair#*:}:ci"
          done
      - name: Smoke test (write, restart compute, read back through the pageserver)
        run: ci/compose-smoke.sh
      - name: CREATE EXTENSION for every extension
        run: ci/ext-test.sh create
      - name: Extension regression tests
        # h3-pg differs in the last digits of a float on arm64 and pg_cron's expected
        # output predates PG18's MD5 deprecation warning, so neither is run here.
        run: >
          ci/ext-test.sh run pgvector pg_ivm pg_semver pg_hint_plan plpgsql_check pgx_ulid
          pg_session_jwt pg_graphql postgis rum pgrag plv8 online_advisor
      - name: pg_duckdb with shared_preload_libraries
        env:
          PRELOAD_EXTRA: pg_duckdb
        run: ci/duckdb-test.sh

  publish:
    needs: [meta, test]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    concurrency: publish
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Pick the next build number
        id: n
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One counter for all images: the highest numeric storage tag, plus one.
          last=$(gh api --paginate "/users/${{ github.repository_owner }}/packages/container/neonlibre%2Fstorage/versions" \
                   --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          echo "n=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - name: Tag multi-arch images
        env:
          N: ${{ steps.n.outputs.n }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          tag() {  # tag <image> <tags...>
            local img="$1"; shift
            local args=(); for t in "$@"; do args+=(-t "$REGISTRY/$img:$t"); done
            docker buildx imagetools create "${args[@]}" \
              "$REGISTRY/$img:ci-$SHA-amd64" "$REGISTRY/$img:ci-$SHA-arm64"
          }
          for v in "17:${{ needs.meta.outputs.pg17 }}" "18:${{ needs.meta.outputs.pg18 }}"; do
            major="${v%%:*}" full="${v#*:}"
            tag "compute-v$major" "$full.$N" "$full" "$major" latest
          done
          tag storage "$N" latest
          echo "published build $N" >> "$GITHUB_STEP_SUMMARY"
