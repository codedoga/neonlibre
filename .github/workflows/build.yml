name: build

# Builds, tests and publishes the compute images (PostgreSQL 17 and 18) and the
# storage image, for amd64 and arm64, doing only the work a change requires.
#
# ci/plan.py hashes the inputs of every image (Dockerfile stages, the files they
# copy, the checked-out submodule) and looks the hashes up in GHCR:
#   <registry>/stage:v<pg>-<stage>-<hash>-<arch>          shared bases and heavy extension stages
#   <registry>/compute-v<pg>:<hash>-<arch>, storage:<hash>-<arch>   built images
#   <registry>/compute-v<pg>:<hash>, storage:<hash>       ...that passed the tests
# Whatever already exists is skipped, so e.g. a PostgreSQL 17 minor update rebuilds
# only the v17 stages, the v17 compute image and storage, and changing one extension
# rebuilds only its stage (if it has one) and the compute images.
#
# Published tags (see README): compute-v18:18.6.<n>, 18.6, 18, latest; storage:<n>, latest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish version tags for images that changed
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# One build per ref at a time; a second one waits instead of duplicating the work.
concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/neonlibre
  REF: ${{ inputs.ref || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.plan.outputs.base }}
      stages: ${{ steps.plan.outputs.stages }}
      compute: ${{ steps.plan.outputs.compute }}
      storage: ${{ steps.plan.outputs.storage }}
      test: ${{ steps.plan.outputs.test }}
      images: ${{ steps.plan.outputs.images }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - run: git submodule update --init --depth 1 vendor/postgres-v17 vendor/postgres-v18
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 ci/test_input_hash.py
      - id: plan
        run: |
          python3 ci/plan.py >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "${{ inputs.publish }}" == true ]] ||
             [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/main ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          { echo '```'; cat "$GITHUB_OUTPUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  base:
    needs: plan
    if: needs.plan.outputs.base != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.base) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - run: git submodule update --init --depth 1 vendor/postgres-v${{ matrix.pg }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the missing bases, each on top of the previous ones
        env:
          TARGETS: ${{ toJSON(matrix.targets) }}
        run: |
          ctx=()
          while read -r target ref build; do
            if [[ "$build" == true ]]; then
              ci/build-compute.sh ${{ matrix.pg }} ${{ matrix.arch }} "$target" "$ref" "${ctx[@]}"
            fi
            ctx+=("$target=$ref")
          done < <(jq -r '.[] | "\(.target) \(.ref) \(.build)"' <<<"$TARGETS")

  stages:
    needs: [plan, base]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.stages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stages) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - run: git submodule update --init --depth 1 vendor/postgres-v${{ matrix.pg }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ci/build-compute.sh ${{ matrix.pg }} ${{ matrix.arch }} ${{ matrix.target }} ${{ matrix.ref }} ${{ matrix.contexts }}

  compute:
    needs: [plan, stages]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.compute != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.compute) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - run: git submodule update --init --depth 1 vendor/postgres-v${{ matrix.pg }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image
        if: matrix.final != ''
        env:
          BUILD_TAG: ${{ github.sha }}
          CACHE_REF: ${{ env.REGISTRY }}/cache:compute-v${{ matrix.pg }}-${{ matrix.arch }}-final
        run: ci/build-compute.sh ${{ matrix.pg }} ${{ matrix.arch }} "" ${{ matrix.final }} ${{ matrix.contexts }}
      - name: Extension test image
        if: matrix.tests != ''
        env:
          CACHE_REF: ${{ env.REGISTRY }}/cache:compute-v${{ matrix.pg }}-${{ matrix.arch }}-tests
        run: ci/build-compute.sh ${{ matrix.pg }} ${{ matrix.arch }} extension-tests ${{ matrix.tests }} ${{ matrix.contexts }}

  storage:
    needs: plan
    if: needs.plan.outputs.storage != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.storage) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      # postgres_ffi's bindgen needs the headers of every version it supports, so all submodules.
      - run: git submodule update --init --depth 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REPOSITORY=ghcr.io/neondatabase
            IMAGE=build-tools
            TAG=pinned-bookworm
            DEBIAN_VERSION=bookworm
            GIT_VERSION=${{ github.sha }}
            BUILD_TAG=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/cache:storage-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/cache:storage-${{ matrix.arch }},mode=max,ignore-error=true
          push: true
          tags: ${{ matrix.ref }}

  test:
    needs: [plan, compute, storage]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.test != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      PG_VERSION: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the images and tag them with the names docker-compose expects
        run: |
          for pair in "${{ matrix.storage }} neon" "${{ matrix.compute }} compute-node-v$PG_VERSION" \
                      "${{ matrix.tests }} neon-test-extensions-v$PG_VERSION"; do
            read -r src name <<<"$pair"
            docker pull "$src" && docker tag "$src" "neonlibre/$name:ci"
          done
      - name: Smoke test (write, restart compute, read back through the pageserver)
        id: smoke
        run: ci/compose-smoke.sh
      # The remaining checks are independent: once the stack works, run all of them,
      # so that one run reports every failure instead of stopping at the first.
      - name: CREATE EXTENSION for every extension
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: ci/ext-test.sh create
      - name: Extension regression tests
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        # h3-pg differs in the last digits of a float on arm64 and pg_cron's expected
        # output predates PG18's MD5 deprecation warning, so neither is run here.
        run: >
          ci/ext-test.sh run pgvector pg_ivm pg_semver pg_hint_plan plpgsql_check pgx_ulid
          pg_session_jwt pg_graphql postgis rum pgrag plv8 online_advisor
      - name: pg_duckdb with shared_preload_libraries
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        env:
          PRELOAD_EXTRA: pg_duckdb
        run: ci/duckdb-test.sh

  promote:
    needs: [plan, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag tested images with their plain hash (multi-arch)
        env:
          IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          jq -r '.[] | "\(.name) \(.hash)"' <<<"$IMAGES" | while read -r name hash; do
            ref="$REGISTRY/$name:$hash"
            docker buildx imagetools inspect "$ref" >/dev/null 2>&1 && continue
            docker buildx imagetools create -t "$ref" "$ref-amd64" "$ref-arm64"
            echo "tested: $ref" >> "$GITHUB_STEP_SUMMARY"
          done

  publish:
    needs: [plan, promote]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    concurrency: publish
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add version tags to images that changed
        env:
          IMAGES: ${{ needs.plan.outputs.images }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest; }
          tags() {  # every tag of an image, from the registry API; any failure stops the job
            local repo="${REGISTRY#ghcr.io/}/$1" token
            token=$(curl -fsSL -u "${{ github.actor }}:$TOKEN" "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)
            # shortcut: no pagination; fine while an image has fewer than 10000 tags.
            curl -fsSL -H "Authorization: Bearer $token" "https://ghcr.io/v2/$repo/tags/list?n=10000" | jq -r '.tags[]?'
          }
          jq -r '.[] | "\(.name) \(.hash) \(.version)"' <<<"$IMAGES" | while read -r name hash version; do
            ref="$REGISTRY/$name:$hash"
            if [[ "$(digest "$ref")" == "$(digest "$REGISTRY/$name:latest")" ]]; then
              echo "$name: unchanged" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            all=$(tags "$name")
            if [[ "$name" == storage ]]; then
              n=$(( $(grep -E '^[0-9]+$' <<<"$all" | sort -n | tail -1 || echo 0) + 1 ))
              new=("$n" latest)
            else
              n=$(( $(sed -nE 's/^[0-9]+\.[0-9]+\.([0-9]+)$/\1/p' <<<"$all" | sort -n | tail -1 || echo 0) + 1 ))
              new=("$version.$n" "$version" "${version%%.*}" latest)
            fi
            args=(); for t in "${new[@]}"; do args+=(-t "$REGISTRY/$name:$t"); done
            docker buildx imagetools create "${args[@]}" "$ref"
            echo "$name: ${new[*]}" >> "$GITHUB_STEP_SUMMARY"
          done
